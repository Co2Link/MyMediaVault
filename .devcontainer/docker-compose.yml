version: "3.9"

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../..:/workspaces:cached
      - claude:/home/vscode/.claude
      - codex:/home/vscode/.codex
      - gemini:/home/vscode/.gemini
      - uv-cache:/root/.cache/uv
    command: sleep infinity
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017
    networks:
      - devnet

  mongo:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - devnet

volumes:
  mongo-data:
  claude:
  codex:
  gemini:
  uv-cache:

networks:
  devnet: