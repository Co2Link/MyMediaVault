version: "3.9"

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    ports:
      - "6881:6881/tcp" # For libtorrent peer connections
      - "6881:6881/udp" # For libtorrent DHT and UDP traffic
    volumes:
      - ../..:/workspaces:cached
      - claude:/home/vscode/.claude
      - codex:/home/vscode/.codex
      - gemini:/home/vscode/.gemini
      - uv-cache:/root/.cache/uv
    command: sleep infinity
    networks:
      - devnet
  mongo:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - config_db:/data/configdb
    network_mode: service:devcontainer
volumes:
  claude:
  codex:
  gemini:
  uv-cache:
  mongo-data:
  config_db:

networks:
  devnet:
