version: "3.9"

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    ports:
      - "4500:4500" # For codex app-server
    volumes:
      - ../..:/workspaces:cached
      - claude:/home/vscode/.claude
      - codex:/home/vscode/.codex
      - gemini:/home/vscode/.gemini
      - uv-cache:/root/.cache/uv
    command: sleep infinity
    networks:
      - devnet

volumes:
  claude:
  codex:
  gemini:
  uv-cache:

networks:
  devnet:
