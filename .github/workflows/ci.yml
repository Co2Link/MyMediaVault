name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: sqlserver://localhost:1433;database=mymediavault;user=sa;password=Password123!;trustServerCertificate=true
      AUTH_SECRET: test-secret
      AUTH_MICROSOFT_ENTRA_ID_ID: test-client-id
      AUTH_MICROSOFT_ENTRA_ID_SECRET: test-client-secret
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: https://login.microsoftonline.com/test-tenant/v2.0
      MMV_ADMIN_OBJECT_IDS: '[]'
      MMV_ADMIN_GROUP_OBJECT_IDS: '[]'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm run test

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    env:
      TF_VAR_app_image: docker.io/example/mymediavault:validate
      TF_VAR_app_commit_sha: validate
      TF_VAR_database_admin_password: ${{ secrets.TF_VAR_DATABASE_ADMIN_PASSWORD }}
      TF_VAR_auth_secret: test-auth-secret
      TF_VAR_entra_tenant_id: ${{ vars.AUTH_MICROSOFT_ENTRA_ID_TENANT }}
      TF_VAR_auth_entra_client_id: ${{ vars.AUTH_MICROSOFT_ENTRA_ID_ID }}
      TF_VAR_auth_entra_client_secret: test-entra-client-secret
      TF_VAR_admin_object_ids: ${{ vars.TF_VAR_ADMIN_OBJECT_IDS || '[]' }}
      TF_VAR_admin_group_object_ids: ${{ vars.TF_VAR_ADMIN_GROUP_OBJECT_IDS || '[]' }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - name: Check formatting
        run: terraform fmt -check -recursive ../..
      - name: Initialize without backend
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
