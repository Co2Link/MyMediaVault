name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      functions: ${{ steps.filter.outputs.functions }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - '.github/workflows/**'
              - 'apps/web/**'
              - 'packages/core/**'
            functions:
              - '.github/workflows/**'
              - 'apps/functions/**'
              - 'packages/core/**'
            terraform:
              - '.github/workflows/**'
              - 'infra/terraform/**'

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/mymediavault
      MMV_MONGODB_DB_NAME: mymediavault
      AUTH_SECRET: test-secret
      AUTH_MICROSOFT_ENTRA_ID_ID: test-client-id
      AUTH_MICROSOFT_ENTRA_ID_SECRET: test-client-secret
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: https://login.microsoftonline.com/test-tenant/v2.0
      MMV_ADMIN_OBJECT_IDS: '[]'
      MMV_ADMIN_GROUP_OBJECT_IDS: '[]'
    steps:
      - uses: actions/checkout@v5
      - uses: supercharge/mongodb-github-action@1.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/core/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  functions:
    needs: changes
    if: ${{ needs.changes.outputs.functions == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/functions
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/mymediavault
      MMV_MONGODB_DB_NAME: mymediavault
      AzureWebJobsStorage: UseDevelopmentStorage=true
      MMV_TORRENT_PROVIDER: fake
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/functions/package-lock.json
            packages/core/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  terraform:
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    env:
      TF_VAR_app_image: docker.io/example/mymediavault:validate
      TF_VAR_app_commit_sha: validate
      TF_VAR_auth_secret: test-auth-secret
      TF_VAR_entra_tenant_id: ${{ vars.AUTH_MICROSOFT_ENTRA_ID_TENANT }}
      TF_VAR_auth_entra_client_id: ${{ vars.AUTH_MICROSOFT_ENTRA_ID_ID }}
      TF_VAR_auth_entra_client_secret: test-entra-client-secret
      TF_VAR_admin_object_ids: ${{ vars.TF_VAR_ADMIN_OBJECT_IDS || '[]' }}
      TF_VAR_admin_group_object_ids: ${{ vars.TF_VAR_ADMIN_GROUP_OBJECT_IDS || '[]' }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - name: Check formatting
        run: terraform fmt -check -recursive ../..
      - name: Initialize without backend
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
