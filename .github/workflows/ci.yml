name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      vm_worker: ${{ steps.filter.outputs.vm_worker }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - '.github/workflows/**'
              - 'apps/web/**'
              - 'packages/core/**'
            vm_worker:
              - '.github/workflows/**'
              - 'apps/vm-worker/**'
            terraform:
              - '.github/workflows/**'
              - 'infra/terraform/**'
      - name: Write dev deployment change flags
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: |
          mkdir -p dev-change-flags
          {
            echo "web=${{ steps.filter.outputs.web }}"
            echo "vm_worker=${{ steps.filter.outputs.vm_worker }}"
            echo "terraform=${{ steps.filter.outputs.terraform }}"
          } > dev-change-flags/flags.env
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        with:
          name: dev-change-flags
          path: dev-change-flags/flags.env
          retention-days: 1

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/mymediavault
      MMV_MONGODB_DB_NAME: mymediavault
      AUTH_SECRET: test-secret
      AUTH_MICROSOFT_ENTRA_ID_ID: test-client-id
      AUTH_MICROSOFT_ENTRA_ID_SECRET: test-client-secret
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: https://login.microsoftonline.com/test-tenant/v2.0
      MMV_ADMIN_OBJECT_IDS: '[]'
      MMV_ADMIN_GROUP_OBJECT_IDS: '[]'
    steps:
      - uses: actions/checkout@v5
      - uses: supercharge/mongodb-github-action@1.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/core/package-lock.json
      - run: npm --prefix ../../packages/core ci
      - run: npm ci
      - run: npm run build
      - run: npm run test

  vm_worker:
    needs: changes
    if: ${{ needs.changes.outputs.vm_worker == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vm-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest

  terraform:
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    env:
      TF_VAR_app_image: docker.io/example/mymediavault:validate
      TF_VAR_app_commit_sha: validate
      TF_VAR_auth_secret: test-auth-secret
      TF_VAR_entra_tenant_id: ${{ vars.AUTH_MICROSOFT_ENTRA_ID_TENANT }}
      TF_VAR_auth_entra_client_id: ${{ vars.AUTH_MICROSOFT_ENTRA_ID_ID }}
      TF_VAR_auth_entra_client_secret: test-entra-client-secret
      TF_VAR_admin_object_ids: ${{ vars.TF_VAR_ADMIN_OBJECT_IDS || '[]' }}
      TF_VAR_admin_group_object_ids: ${{ vars.TF_VAR_ADMIN_GROUP_OBJECT_IDS || '[]' }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - name: Check formatting
        run: terraform fmt -check -recursive ../..
      - name: Initialize without backend
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  result:
    if: ${{ always() }}
    needs:
      - changes
      - web
      - vm_worker
      - terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check required results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_RESULT: ${{ needs.web.result }}
          VM_WORKER_RESULT: ${{ needs.vm_worker.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
        run: |
          test "$CHANGES_RESULT" = "success"

          for result in "$WEB_RESULT" "$VM_WORKER_RESULT" "$TERRAFORM_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
