name: Dev

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_terraform_apply:
        description: Apply Terraform with the current deployed image.
        required: true
        type: boolean
        default: true

concurrency:
  group: dev
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ${{ vars.WEB_IMAGE }}

jobs:
  changes:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      web: ${{ steps.flags.outputs.web }}
      worker: ${{ steps.flags.outputs.worker }}
      terraform: ${{ steps.flags.outputs.terraform }}
    steps:
      - name: Download CI change flags
        if: ${{ github.event_name == 'workflow_run' }}
        run: gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name dev-change-flags --dir dev-change-flags
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}

      - name: Use CI change flags
        id: ci-flags
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          source dev-change-flags/flags.env
          {
            echo "web=${web}"
            echo "worker=${worker}"
            echo "terraform=${terraform}"
          } >> "$GITHUB_OUTPUT"

      - name: Use manual change flags
        id: manual-flags
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          {
            echo "web=false"
            echo "worker=false"
            echo "terraform=${FORCE_TERRAFORM_APPLY}"
          } >> "$GITHUB_OUTPUT"
        env:
          FORCE_TERRAFORM_APPLY: ${{ inputs.force_terraform_apply }}

      - id: flags
        shell: bash
        run: |
          {
            echo "web=${CI_WEB:-${MANUAL_WEB}}"
            echo "worker=${CI_WORKER:-${MANUAL_WORKER}}"
            echo "terraform=${CI_TERRAFORM:-${MANUAL_TERRAFORM}}"
          } >> "$GITHUB_OUTPUT"
        env:
          CI_WEB: ${{ steps.ci-flags.outputs.web }}
          CI_WORKER: ${{ steps.ci-flags.outputs.worker }}
          CI_TERRAFORM: ${{ steps.ci-flags.outputs.terraform }}
          MANUAL_WEB: ${{ steps.manual-flags.outputs.web }}
          MANUAL_WORKER: ${{ steps.manual-flags.outputs.worker }}
          MANUAL_TERRAFORM: ${{ steps.manual-flags.outputs.terraform }}

  image:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        shell: bash
        run: |
          repo="${IMAGE_REPOSITORY}"
          if [[ "${repo##*/}" == *:* ]]; then
            repo="${repo%:*}"
          fi
          echo "image=${repo}:${HEAD_SHA}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}

  worker_image:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        shell: bash
        run: |
          repo="${IMAGE_REPOSITORY}"
          if [[ "${repo##*/}" == *:* ]]; then
            repo="${repo%:*}"
          fi
          echo "image=${repo}-worker:${HEAD_SHA}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}

  terraform:
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && needs.changes.outputs.terraform == 'true' && (needs.image.result == 'success' || needs.image.result == 'skipped') && needs.worker_image.result == 'success' }}
    runs-on: ubuntu-latest
    needs:
      - changes
      - image
      - worker_image
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    env:
      TF_VAR_auth_secret: ${{ secrets.AUTH_SECRET }}
      TF_VAR_entra_tenant_id: ${{ vars.AUTH_MICROSOFT_ENTRA_ID_TENANT }}
      TF_VAR_auth_entra_client_id: ${{ vars.AUTH_MICROSOFT_ENTRA_ID_ID }}
      TF_VAR_auth_entra_client_secret: ${{ secrets.AUTH_MICROSOFT_ENTRA_ID_SECRET }}
      TF_VAR_admin_object_ids: ${{ vars.TF_VAR_ADMIN_OBJECT_IDS || '[]' }}
      TF_VAR_admin_group_object_ids: ${{ vars.TF_VAR_ADMIN_GROUP_OBJECT_IDS || '[]' }}
      TF_VAR_r2_endpoint: ${{ vars.R2_ENDPOINT }}
      TF_VAR_r2_access_key_id: ${{ vars.R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      TF_VAR_r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_r2_bucket_name: ${{ vars.R2_BUCKET_NAME || 'torrent-raw' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Use pushed image
        if: ${{ needs.changes.outputs.web == 'true' }}
        shell: bash
        run: |
          repo="${IMAGE_REPOSITORY}"
          if [[ "${repo##*/}" == *:* ]]; then
            repo="${repo%:*}"
          fi
          {
            echo "TF_VAR_app_image=${repo}:${HEAD_SHA}"
            echo "TF_VAR_app_commit_sha=${HEAD_SHA}"
            echo "TF_VAR_worker_image=${repo}-worker:${HEAD_SHA}"
          } >> "$GITHUB_ENV"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Use current deployed image
        if: ${{ needs.changes.outputs.web != 'true' }}
        shell: bash
        run: |
          repo="${IMAGE_REPOSITORY}"
          if [[ "${repo##*/}" == *:* ]]; then
            repo="${repo%:*}"
          fi
          current_image="$(
            az containerapp show \
              --resource-group rg-mmv-dev \
              --name mmv-dev-web \
              --query "properties.template.containers[?name=='web'].image | [0]" \
              --output tsv
          )"
          current_commit="$(
            az containerapp show \
              --resource-group rg-mmv-dev \
              --name mmv-dev-web \
              --query "properties.template.containers[?name=='web'].env[?name=='MMV_COMMIT_SHA'].value | [0]" \
              --output tsv
          )"
          if [[ -z "$current_commit" && "$current_image" == *:* ]]; then
            current_commit="${current_image##*:}"
          fi
          if [[ -z "$current_image" || -z "$current_commit" ]]; then
            echo "Unable to resolve the current deployed web image and commit." >&2
            exit 1
          fi
          {
            echo "TF_VAR_app_image=${current_image}"
            echo "TF_VAR_app_commit_sha=${current_commit}"
            if [[ "$WORKER_CHANGED" == "true" ]]; then
              echo "TF_VAR_worker_image=${WORKER_IMAGE}"
            else
              echo "TF_VAR_worker_image=${repo}-worker:${current_commit}"
            fi
          } >> "$GITHUB_ENV"
        env:
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          WORKER_CHANGED: ${{ needs.changes.outputs.worker }}
          WORKER_IMAGE: ${{ needs.worker_image.outputs.image }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize repo-owned state backend
        shell: bash
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=mymediavault-tfstate" \
            -backend-config="key=envs/dev/terraform.tfstate" \
            -backend-config="region=auto" \
            -backend-config="endpoint=${R2_ENDPOINT}" \
            -backend-config="access_key=${R2_ACCESS_KEY_ID}" \
            -backend-config="secret_key=${R2_SECRET_ACCESS_KEY}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="force_path_style=true"
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        run: terraform apply -auto-approve tfplan

  container_app_deploy:
    if: ${{ always() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.web == 'true' && needs.image.result == 'success' && needs.worker_image.result == 'success' && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs:
      - changes
      - image
      - worker_image
      - terraform
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy image
        if: ${{ needs.changes.outputs.terraform != 'true' }}
        shell: bash
        run: |
          repo="${IMAGE_REPOSITORY}"
          if [[ "${repo##*/}" == *:* ]]; then
            repo="${repo%:*}"
          fi
          image="${repo}:${HEAD_SHA}"

          az containerapp update \
            --resource-group rg-mmv-dev \
            --name mmv-dev-web \
            --image "$image" \
            --set-env-vars "MMV_COMMIT_SHA=${HEAD_SHA}"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Terraform deployed image
        if: ${{ needs.changes.outputs.terraform == 'true' }}
        run: echo "Terraform applied the new image and commit."

  worker_job_deploy:
    if: ${{ always() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.worker == 'true' && needs.worker_image.result == 'success' && needs.terraform.result == 'skipped' }}
    runs-on: ubuntu-latest
    needs:
      - changes
      - worker_image
      - terraform
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy worker image
        shell: bash
        run: |
          az containerapp job update \
            --resource-group rg-mmv-dev \
            --name mmv-dev-worker \
            --image "${{ needs.worker_image.outputs.image }}"

  smoke:
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && needs.changes.outputs.terraform == 'true') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')) && (needs.changes.outputs.web != 'true' || needs.image.result == 'success') && needs.worker_image.result == 'success' && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') && (needs.container_app_deploy.result == 'success' || needs.container_app_deploy.result == 'skipped') && (needs.worker_job_deploy.result == 'success' || needs.worker_job_deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs:
      - changes
      - image
      - worker_image
      - terraform
      - container_app_deploy
      - worker_job_deploy
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - id: resources
        shell: bash
        run: |
          {
            echo "web_url=https://$(
              az containerapp show \
                --resource-group rg-mmv-dev \
                --name mmv-dev-web \
                --query "properties.configuration.ingress.fqdn" \
                --output tsv
            )"
            echo "worker_job_name=$(
              az containerapp job show \
                --resource-group rg-mmv-dev \
                --name mmv-dev-worker \
                --query "name" \
                --output tsv
            )"
          } >> "$GITHUB_OUTPUT"

      - name: Web health
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.changes.outputs.web == 'true' && github.event.workflow_run.head_sha || '' }}
        run: |
          for attempt in $(seq 1 30); do
            if response="$(
              curl --fail --connect-timeout 10 --max-time 20 \
                "${{ steps.resources.outputs.web_url }}/api/health"
            )"; then
              echo "$response"
              if test -z "$EXPECTED_COMMIT"; then
                exit 0
              fi
              if test "$(echo "$response" | jq -r .commit)" = "$EXPECTED_COMMIT"; then
                exit 0
              fi
            fi
            sleep 10
          done

          echo "Web health never reported commit $EXPECTED_COMMIT"
          exit 1

      - name: Worker job presence
        run: |
          az containerapp job show \
            --resource-group rg-mmv-dev \
            --name "${{ steps.resources.outputs.worker_job_name }}" \
            --query "name" \
            --output tsv
