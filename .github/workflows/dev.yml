name: Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: Build image, apply Terraform, and deploy frontend
        required: true
        default: false
        type: boolean

concurrency:
  group: dev
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - id: image
        run: echo "image=${{ vars.BACKEND_IMAGE }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.deploy }}
          tags: ${{ steps.image.outputs.image }}

  terraform:
    runs-on: ubuntu-latest
    needs: image
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    env:
      TF_VAR_backend_image: ${{ needs.image.outputs.image }}
      TF_VAR_database_admin_password: ${{ secrets.TF_VAR_DATABASE_ADMIN_PASSWORD }}
      TF_VAR_entra_tenant_id: ${{ vars.VITE_ENTRA_TENANT_ID }}
      TF_VAR_frontend_entra_client_id: ${{ vars.VITE_ENTRA_CLIENT_ID }}
      TF_VAR_backend_entra_client_id: ${{ vars.BACKEND_ENTRA_CLIENT_ID }}
      TF_VAR_entra_api_scope: ${{ vars.VITE_API_SCOPE }}
      TF_VAR_admin_object_ids: ${{ vars.TF_VAR_ADMIN_OBJECT_IDS }}
    outputs:
      backend_url: ${{ steps.outputs.outputs.backend_url }}
      frontend_url: ${{ steps.outputs.outputs.frontend_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize remote state
        run: |
          terraform init -reconfigure \
            -backend-config=resource_group_name="${{ vars.TERRAFORM_STATE_RESOURCE_GROUP }}" \
            -backend-config=storage_account_name="${{ vars.TERRAFORM_STATE_STORAGE_ACCOUNT }}" \
            -backend-config=container_name="${{ vars.TERRAFORM_STATE_CONTAINER }}" \
            -backend-config=key="${{ vars.TERRAFORM_STATE_KEY }}"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        run: terraform apply -auto-approve tfplan

      - id: outputs
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        run: |
          {
            echo "backend_url=$(terraform output -raw backend_url)"
            echo "frontend_url=$(terraform output -raw frontend_url)"
          } >> "$GITHUB_OUTPUT"

  frontend:
    runs-on: ubuntu-latest
    needs: terraform
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ needs.terraform.outputs.backend_url }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}

      - id: swa-token
        name: Read Static Web Apps deployment token
        run: |
          token="$(
            az staticwebapp secrets list \
              --name "${{ vars.AZURE_FRONTEND_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query properties.apiKey \
              --output tsv
          )"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: apps/frontend
          output_location: dist

  smoke:
    runs-on: ubuntu-latest
    needs: [terraform, frontend]
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    steps:
      - name: Backend health
        run: curl --fail --retry 12 --retry-all-errors --retry-delay 10 "${{ needs.terraform.outputs.backend_url }}/health"

      - name: Frontend health
        run: curl --fail --retry 12 --retry-all-errors --retry-delay 10 "${{ needs.terraform.outputs.frontend_url }}"
