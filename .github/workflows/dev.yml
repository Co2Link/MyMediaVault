name: Dev

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]

concurrency:
  group: dev
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ${{ vars.WEB_IMAGE }}

jobs:
  image:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        shell: bash
        run: |
          repo="${IMAGE_REPOSITORY}"
          if [[ "${repo##*/}" == *:* ]]; then
            repo="${repo%:*}"
          fi
          echo "image=${repo}:${HEAD_SHA}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}

  terraform:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    needs: image
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    env:
      TF_VAR_app_commit_sha: ${{ github.event.workflow_run.head_sha }}
      TF_VAR_database_admin_password: ${{ secrets.TF_VAR_DATABASE_ADMIN_PASSWORD }}
      TF_VAR_auth_secret: ${{ secrets.AUTH_SECRET }}
      TF_VAR_entra_tenant_id: ${{ vars.AUTH_MICROSOFT_ENTRA_ID_TENANT }}
      TF_VAR_auth_entra_client_id: ${{ vars.AUTH_MICROSOFT_ENTRA_ID_ID }}
      TF_VAR_auth_entra_client_secret: ${{ secrets.AUTH_MICROSOFT_ENTRA_ID_SECRET }}
      TF_VAR_admin_object_ids: ${{ vars.TF_VAR_ADMIN_OBJECT_IDS || '[]' }}
      TF_VAR_admin_group_object_ids: ${{ vars.TF_VAR_ADMIN_GROUP_OBJECT_IDS || '[]' }}
    outputs:
      web_url: ${{ steps.outputs.outputs.web_url }}
      worker_name: ${{ steps.outputs.outputs.worker_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute image reference
        shell: bash
        run: |
          repo="${IMAGE_REPOSITORY}"
          if [[ "${repo##*/}" == *:* ]]; then
            repo="${repo%:*}"
          fi
          echo "TF_VAR_app_image=${repo}:${HEAD_SHA}" >> "$GITHUB_ENV"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize repo-owned state backend
        shell: bash
        run: |
          backend_access_key="$(
            az storage account keys list \
              --resource-group rg-mymediavault-tfstate \
              --account-name mymediavaulttfstate \
              --query '[0].value' \
              --output tsv
          )"
          echo "::add-mask::$backend_access_key"
          terraform init -reconfigure -backend-config="access_key=${backend_access_key}"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        run: terraform apply -auto-approve tfplan

      - id: outputs
        run: |
          {
            echo "web_url=$(terraform output -raw web_url)"
            echo "worker_name=$(terraform output -raw worker_name)"
          } >> "$GITHUB_OUTPUT"

  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Web health
        shell: bash
        run: |
          expected_commit="${{ github.event.workflow_run.head_sha }}"
          for attempt in $(seq 1 30); do
            if response="$(
              curl --fail --connect-timeout 10 --max-time 20 \
                "${{ needs.terraform.outputs.web_url }}/api/health"
            )"; then
              echo "$response"
              if test "$(echo "$response" | jq -r .commit)" = "$expected_commit"; then
                exit 0
              fi
            fi
            sleep 10
          done

          echo "Web health never reported commit $expected_commit"
          exit 1

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Worker revision
        run: |
          az containerapp show \
            --resource-group rg-mmv-dev \
            --name "${{ needs.terraform.outputs.worker_name }}" \
            --query "properties.latestRevisionName" \
            --output tsv
