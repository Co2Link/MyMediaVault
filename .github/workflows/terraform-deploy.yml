name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the Terraform plan
        required: true
        default: false
        type: boolean

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    env:
      TF_VAR_backend_image: ${{ vars.BACKEND_IMAGE }}
      TF_VAR_database_admin_password: ${{ secrets.TF_VAR_DATABASE_ADMIN_PASSWORD }}
      TF_VAR_entra_tenant_id: ${{ vars.VITE_ENTRA_TENANT_ID }}
      TF_VAR_frontend_entra_client_id: ${{ vars.VITE_ENTRA_CLIENT_ID }}
      TF_VAR_backend_entra_client_id: ${{ vars.BACKEND_ENTRA_CLIENT_ID }}
      TF_VAR_entra_api_scope: ${{ vars.VITE_API_SCOPE }}
      TF_VAR_admin_object_ids: ${{ vars.TF_VAR_ADMIN_OBJECT_IDS }}
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive ../..

      - name: Initialize remote state
        run: |
          terraform init -reconfigure \
            -backend-config=resource_group_name="${{ vars.TERRAFORM_STATE_RESOURCE_GROUP }}" \
            -backend-config=storage_account_name="${{ vars.TERRAFORM_STATE_STORAGE_ACCOUNT }}" \
            -backend-config=container_name="${{ vars.TERRAFORM_STATE_CONTAINER }}" \
            -backend-config=key="${{ vars.TERRAFORM_STATE_KEY }}"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        if: ${{ inputs.apply }}
        run: terraform apply -auto-approve tfplan

      - name: Outputs
        if: ${{ inputs.apply }}
        run: terraform output -json
